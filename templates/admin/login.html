{% extends "admin/base.html" %}
{% block title %}로그인{% endblock %}
{% block layout %}
<div class="login">
  <form method="post">
    <h1>ADMIN</h1>
    {% with msgs = get_flashed_messages() %}{% for mm in msgs %}<div class="flash" style="background:#fef2f2;color:#991b1b;border-color:#fecaca">{{ mm }}</div>{% endfor %}{% endwith %}
    <input name="id" placeholder="아이디" required autofocus>
    <input name="pw" type="password" placeholder="비밀번호" required>
    <button class="btn" type="submit">로그인</button>
  </form>
</div>
{% endblock %}
